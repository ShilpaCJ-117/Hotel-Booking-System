<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 30px;
        }

        h2 {
            text-align: center;
        }

        .stats {
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        th {
            background: #2c3e50;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        .edit-btn {
            background: blue;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            margin-right: 5px;
            cursor: pointer;
        }

        .delete-btn {
            background: red;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-btn:hover {
            background: darkblue;
        }

        .delete-btn:hover {
            background: darkred;
        }
    </style>
</head>
<body>

<h2>Admin Panel - All Bookings</h2>

<div class="stats">
    Total Bookings: <span id="totalCount">0</span>
</div>

<table id="bookingTable">
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Hotel</th>
            <th>Guests</th>
            <th>Checkin</th>
            <th>Checkout</th>
            <th>Total</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>

async function loadBookings() {

    const response = await fetch("http://localhost:5000/api/bookings");
    const data = await response.json();

    const tableBody = document.querySelector("#bookingTable tbody");
    tableBody.innerHTML = "";

    document.getElementById("totalCount").innerText = data.length;

    data.forEach(booking => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${booking.name}</td>
            <td>${booking.email}</td>
            <td>${booking.hotel}</td>
            <td>${booking.guests}</td>
            <td>${booking.checkin}</td>
            <td>${booking.checkout}</td>
            <td>${booking.total}</td>
            <td>
                <button class="edit-btn" onclick="editBooking('${booking._id}', ${booking.guests})">
                    Edit
                </button>
                <button class="delete-btn" onclick="deleteBooking('${booking._id}')">
                    Delete
                </button>
            </td>
        `;

        tableBody.appendChild(row);
    });
}


// ==============================
// DELETE BOOKING
// ==============================
async function deleteBooking(id) {

    const confirmDelete = confirm("Are you sure you want to delete this booking?");
    if (!confirmDelete) return;

    await fetch(`http://localhost:5000/api/bookings/${id}`, {
        method: "DELETE"
    });

    alert("Booking Deleted ✅");
    loadBookings();
}


// ==============================
// EDIT BOOKING (Update Guests)
// ==============================
async function editBooking(id, currentGuests) {

    const newGuests = prompt("Enter new guest count:", currentGuests);

    if (!newGuests || newGuests < 1) {
        alert("Invalid guest count ❌");
        return;
    }

    await fetch(`http://localhost:5000/api/bookings/${id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            guests: newGuests
        })
    });

    alert("Booking Updated Successfully ✏️");
    loadBookings();
}


loadBookings();

</script>

</body>
</html>
