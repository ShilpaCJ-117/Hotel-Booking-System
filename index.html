<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">HotelBook</div>
    <nav>
        <a href="#">Home</a>
        <a href="#">Rooms</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="search">
    <h2>Find Your Perfect Stay</h2>
    <form id="searchForm">
        <div class="form-group">
            <label>Check-in</label>
            <input type="date" id="checkin" required>
        </div>
        <div class="form-group">
            <label>Check-out</label>
            <input type="date" id="checkout" required>
        </div>
        <div class="form-group">
            <label>Guests</label>
            <input type="number" id="guests" placeholder="1" min="1" required>
        </div>
        <button type="submit">Search</button>
    </form>
</section>

<section class="hotels" id="hotelsSection">
    <h2 class="section-title">Available Hotels</h2>
</section>

<footer>
    <div class="footer-content">
        <h3>HotelBook</h3>
        <p>Book your dream stay anywhere in India.</p>
        <p>Contact: hotelbook@email.com</p>
        <p>© 2026 HotelBook. All Rights Reserved.</p>
    </div>
</footer>

<script>
const hotelData = [
    { name: "Luxury Palace Hotel", price: 4999, rating: 5, img: "https://picsum.photos/300/180?1" },
    { name: "Sea View Resort", price: 3499, rating: 5, img: "https://picsum.photos/300/180?2" },
    { name: "Mountain Inn", price: 2999, rating: 5, img: "https://picsum.photos/300/180?3" },
    { name: "City Central Hotel", price: 3999, rating: 4, img: "https://picsum.photos/300/180?4" },
    { name: "Grand Lake Resort", price: 4599, rating: 5, img: "https://picsum.photos/300/180?5" },
    { name: "Forest Edge Inn", price: 2699, rating: 4, img: "https://picsum.photos/300/180?6" }
];

const hotelsSection = document.getElementById("hotelsSection");
hotelsSection.style.display = "none";

document.getElementById("searchForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const checkin = new Date(document.getElementById("checkin").value);
    const checkout = new Date(document.getElementById("checkout").value);
    const guests = document.getElementById("guests").value;

    if (checkout <= checkin) {
        alert("Check-out date must be after Check-in date!");
        return;
    }

    if (guests < 1) {
        alert("Guests must be at least 1!");
        return;
    }

    alert("Search Successful! Showing Available Hotels ✅");

    hotelsSection.innerHTML = `<h2 class="section-title">Available Hotels</h2>`;

    hotelData.forEach(hotel => {
        const card = document.createElement("div");
        card.className = "hotel-card";
        card.innerHTML = `
            <img src="${hotel.img}" alt="${hotel.name}">
            <h3>${hotel.name}</h3>
            <p class="rating">${'★'.repeat(hotel.rating)}</p>
            <p class="price">₹${hotel.price} / night</p>
            <button onclick="window.location.href='booking.html?hotel=${encodeURIComponent(hotel.name)}'">Book Now</button>
        `;
        hotelsSection.appendChild(card);
    });
    hotelsSection.style.display = "grid";
});
</script>

</body>
</html>
