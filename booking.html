<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="font-family: Arial; background:#f4f6f9; padding:30px;">

<h2>Complete Your Booking</h2>

<form id="bookingForm">

    <label>Hotel Name</label><br>
    <input type="text" id="hotelName" readonly><br><br>

    <label>Your Name</label><br>
    <input type="text" id="userName" required><br><br>

    <label>Email</label><br>
    <input type="email" id="userEmail" required><br><br>

    <label>Guests</label><br>
    <input type="number" id="guestCount" min="1" required><br><br>

    <label>Check-in</label><br>
    <input type="date" id="checkinDate" required><br><br>

    <label>Check-out</label><br>
    <input type="date" id="checkoutDate" required><br><br>

    <button type="submit">Confirm Booking</button>

</form>

<div id="confirmation" style="display:none; margin-top:20px;">
    <h3>Booking Confirmed 🎉</h3>
    <p id="summary"></p>
    <button onclick="goHome()">Back to Home</button>
</div>

<script>

// Get hotel from URL safely
const params = new URLSearchParams(window.location.search);
let hotel = params.get("hotel");

if (hotel) {
    hotel = decodeURIComponent(hotel).trim();
}

// Hotel Prices (MUST match server.js exactly)
const hotelPrices = {
    "Luxury Palace Hotel": 4999,
    "Sea View Resort": 3499,
    "Mountain Inn": 2999,
    "City Central Hotel": 3999,
    "Grand Lake Resort": 4599,
    "Forest Edge Inn": 2699
};

// Validate hotel properly
if (hotel && Object.keys(hotelPrices).includes(hotel)) {
    document.getElementById("hotelName").value = hotel;
} else {
    alert("Invalid hotel selection ❌");
    window.location.href = "index.html";
}

// Date validation
const today = new Date().toISOString().split("T")[0];
document.getElementById("checkinDate").min = today;
document.getElementById("checkoutDate").min = today;

document.getElementById("checkinDate").addEventListener("change", function () {
    document.getElementById("checkoutDate").min = this.value;
});

document.getElementById("bookingForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const name = document.getElementById("userName").value.trim();
    const email = document.getElementById("userEmail").value.trim();
    const guests = parseInt(document.getElementById("guestCount").value);
    const checkinValue = document.getElementById("checkinDate").value;
    const checkoutValue = document.getElementById("checkoutDate").value;

    const checkin = new Date(checkinValue);
    const checkout = new Date(checkoutValue);

    if (checkout <= checkin) {
        alert("Checkout must be after Checkin");
        return;
    }

    const nights = (checkout - checkin) / (1000 * 60 * 60 * 24);
    const total = hotelPrices[hotel] * nights;

    const bookingData = {
        name,
        email,
        hotel,
        guests,
        checkin: checkinValue,
        checkout: checkoutValue,
        total
    };

    try {
        const response = await fetch("http://localhost:5000/api/book", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(bookingData)
        });

        const result = await response.json();

        if (!response.ok) {
            alert(result.message);
            return;
        }

        document.getElementById("summary").innerHTML =
            "Name: " + name +
            "<br>Email: " + email +
            "<br>Hotel: " + hotel +
            "<br>Guests: " + guests +
            "<br>Nights: " + nights +
            "<br>Total: ₹" + total;

        document.getElementById("bookingForm").style.display = "none";
        document.getElementById("confirmation").style.display = "block";

    } catch (error) {
        alert("Server not running ❌");
    }
});

function goHome() {
    window.location.href = "index.html";
}

</script>

</body>
</html>
